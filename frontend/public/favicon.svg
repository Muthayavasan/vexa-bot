<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background: signature warm browned bronze gradient from Linden/Vexa UI -->
    <linearGradient id="vexaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A47E53"/>
      <stop offset="45%" stop-color="#8E683E"/>
      <stop offset="100%" stop-color="#674723"/>
    </linearGradient>

    <!-- White facet: crisp luminous white to soft warm linen -->
    <linearGradient id="vWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F1EA"/>
    </linearGradient>

    <!-- Browned cashmere facet: warm browned gold/cashmere tone -->
    <linearGradient id="vBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBDCCB"/>
      <stop offset="100%" stop-color="#C7A984"/>
    </linearGradient>

    <!-- Subtle drop shadow for depth -->
    <filter id="vShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#221508" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle badge matching bot UI bronze accent -->
  <rect width="64" height="64" rx="16" fill="url(#vexaBg)"/>

  <!-- Elegant inner rim highlight -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.2"/>

  <!-- Iconic Vexa "V" with White & Browned duo-tone facets -->
  <g filter="url(#vShadow)">
    <!-- Left wing: Luminous White -->
    <path d="M 15 16 L 23.5 16 L 32 32 L 32 48 Z" fill="url(#vWhite)"/>
    <!-- Right wing: Browned Cashmere/Bronze -->
    <path d="M 32 32 L 40.5 16 L 49 16 L 32 48 Z" fill="url(#vBrown)"/>
    <!-- Precision crease seam -->
    <line x1="32" y1="32" x2="32" y2="48" stroke="#5E3F1A" stroke-opacity="0.3" stroke-width="0.8"/>
  </g>
</svg>